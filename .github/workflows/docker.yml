name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - "index.js"
      - "package.json"
      - "test/**"
      - "Dockerfile"
      - ".dockerignore"
      - "gosrc/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 快速连推时自动取消过时的构建，只保留最新一次
concurrency:
  group: docker-build
  cancel-in-progress: true

jobs:
  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JS tests
        run: npm test

  go-check:
    needs: js-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build niccore
        working-directory: gosrc
        run: go build -tags with_quic -trimpath -ldflags "-s -w" -o /tmp/niccore ./niccore
      - name: Build niclink
        working-directory: gosrc
        run: go build -trimpath -ldflags "-s -w" -o /tmp/niclink ./niclink
      - name: Smoke check
        run: |
          /tmp/niccore --help > /tmp/smoke.log 2>&1 || { echo "--- niccore FAILED ---"; cat /tmp/smoke.log; exit 1; }
          /tmp/niclink --help > /tmp/smoke.log 2>&1 || { echo "--- niclink FAILED ---"; cat /tmp/smoke.log; exit 1; }
          /tmp/niclink run --help > /tmp/smoke.log 2>&1 || { echo "--- niclink run FAILED ---"; cat /tmp/smoke.log; exit 1; }
          echo "smoke OK"

  # 双架构改用原生 runner 并行构建，不再用 QEMU 模拟 arm64：
  # amd64 跑在 ubuntu-latest，arm64 跑在 ubuntu-24.04-arm，各自 push 临时单架构镜像，
  # 最后由 docker job 合成多架构 manifest。amd64 行为与之前完全一致。
  build-image:
    needs: go-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check index.js

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve niclink tag from index.js FALLBACK
        id: tags
        run: |
          NICLINK_TAG=$(sed -n 's/.*niclink: "\(.*\)".*/\1/p' index.js | head -1)
          echo "niclink_tag=${NICLINK_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:tmp-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            NICLINK_VERSION=${{ steps.tags.outputs.niclink_tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # 镜像里的 niclink 是在原生 runner 上编的（arm64 跑在 ubuntu-24.04-arm），
      # 直接跑一次 --help：既是 smoke，也是和 release 里交叉编译产物的对照。
      - name: Smoke test image binary
        run: |
          docker run --rm "ghcr.io/${{ github.repository }}:tmp-${{ github.sha }}-${{ matrix.arch }}" \
            /app/.bin/niclink run --help > /tmp/img-smoke.log 2>&1 || { echo "--- image smoke FAILED ---"; cat /tmp/img-smoke.log; exit 1; }
          echo "image smoke OK"

  docker:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create multi-arch manifest
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && ARGS+=(-t "$tag")
          done < <(echo "$META_JSON" | jq -r '.tags[]')
          docker buildx imagetools create "${ARGS[@]}" \
            "ghcr.io/${{ github.repository }}:tmp-${{ github.sha }}-amd64" \
            "ghcr.io/${{ github.repository }}:tmp-${{ github.sha }}-arm64"
